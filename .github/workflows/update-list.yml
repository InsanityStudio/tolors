name: Update Scratch Suggestions List

on:
  schedule:
    # Runs every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# This grants the bot permission to push commits (fixes exit code 128)
permissions:
  contents: write

jobs:
  update-list:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch latest source from Scratch
        run: |
          # Download the page. We add a User-Agent to bypass Scratch's Cloudflare block.
          curl -s -L -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            "https://scratch.mit.edu/discuss/post/9319489/source" -o scratch.mit.edu.txt
          
          # Safety check: if the file is empty, stop so we don't delete your data
          if [ ! -s scratch.mit.edu.txt ]; then
            echo "Error: Downloaded file is empty."
            exit 1
          fi

      - name: Check for changes and commit
        run: |
          # Check if the file has been modified
          if git diff --quiet scratch.mit.edu.txt; then
            echo "No changes detected."
            exit 0
          fi

          # If there are changes, commit and push them
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add scratch.mit.edu.txt
          git commit -m "Auto-update: Fetch latest rejected suggestions list"
          git push
