name: Update Scratch Suggestions List

on:
  schedule:
    # Runs every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# This grants the bot permission to push commits (fixes exit code 128)
permissions:
  contents: write

jobs:
  update-list:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch latest source from Scratch
        run: |
          # Keep the committed version so we can show before vs after later.
          cp scratch.mit.edu.txt "$RUNNER_TEMP/scratch.old.txt"

          # Download the page. We add a User-Agent to bypass Scratch's Cloudflare block.
          curl -s -L -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            "https://scratch.mit.edu/discuss/post/9319489/source" -o scratch.mit.edu.txt
          
          # Safety check: if the file is empty, stop so we don't delete your data
          if [ ! -s scratch.mit.edu.txt ]; then
            echo "Error: Downloaded file is empty."
            exit 1
          fi

      - name: Log what changed (before vs after)
        id: diff
        run: |
          if git diff --quiet scratch.mit.edu.txt; then
            echo "No changes detected."
            echo "No changes since last run." >> "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

          # Side-by-side before vs after (red = removed, green = added, yellow = changed).
          # Printed to this log with colours; unchanged stretches are collapsed into
          # expandable groups. Also writes a standalone HTML version for download.
          node .github/scripts/diff-list.js \
            "$RUNNER_TEMP/scratch.old.txt" scratch.mit.edu.txt \
            "$RUNNER_TEMP/summary.txt" "$RUNNER_TEMP/tolors-diff.html"

      - name: Upload side-by-side HTML report
        id: upload
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tolors-diff
          path: ${{ runner.temp }}/tolors-diff.html
          retention-days: 90

      - name: Link the report in the run summary
        if: steps.diff.outputs.changed == 'true'
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download the side-by-side HTML report](${{ steps.upload.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"

      - name: Check for changes and commit
        run: |
          # Check if the file has been modified
          if git diff --quiet scratch.mit.edu.txt; then
            echo "No changes detected."
            exit 0
          fi

          # If there are changes, commit and push them
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add scratch.mit.edu.txt
          git commit -m "Auto-update: $(cat "$RUNNER_TEMP/summary.txt")"
          git push
