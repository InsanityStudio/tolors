<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TOLORS Quoter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="innerwrap">
    <div class="header-container">
      <div class="logo-text">TOLORS Quoter</div>
      <ul class="site-nav">
        <li><span class="nav-item-disabled">by InsanityGames</span></li>
      </ul>
      <!-- Changed to search-active and added ID -->
      <form class="search-active" onsubmit="return false;">
        <input type="submit" class="glass" value="" disabled>
        <input id="headerSearchInput" type="text" placeholder="Search" autocomplete="off">
      </form>
      <ul class="account-nav">
        <li><a href="https://scratch.mit.edu/discuss/post/9319489/" target="_blank" rel="noopener" class="nav-account-clickable">Source</a></li>
        <li><span id="themeToggle" class="nav-account-clickable">Theme: Light</span></li>
      </ul>
    </div>
  </div>

  <div class="main-content">
    <div class="app-card">
      <h1>Rejected Suggestions</h1>
      <div class="subtitle">
        Search the list by entry number, title, or text. Select any result to copy its complete BBCode quote, ready to paste into a Scratch forum post.
      </div>

      <div class="search-box-container">
        <span class="search-icon-visual">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="15" cy="9" r="6"></circle><line x1="10.5" y1="13.5" x2="5" y2="19"></line></svg>
        </span>
        <input type="text" id="appSearchInput" class="functional-search-input" placeholder="Type entry number, title, or keywords...">
      </div>

      <div class="meta-info">
        <span id="resultsCount">Loading...</span>
      </div>

      <div class="results-container" id="resultsList">
        <!-- Dynamic items populated by JavaScript -->
      </div>
    </div>
  </div>

  <div class="toast" id="copyToast">Copied BBCode quote!</div>

  <script src="script.js"></script>
</body>
</html>
